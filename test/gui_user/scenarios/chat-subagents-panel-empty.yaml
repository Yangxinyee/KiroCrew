# Nightly: the Subagents view of the chat side panel. Ctrl+G is the chord that
# opens the panel straight onto its Subagents tab. The fake ACP backend never
# spawns a background run, so this asserts the reachable half of the surface --
# the tab, its "No subagents running" empty state and the panel toggling back
# off -- not the collapsed run cards in the transcript, which need a seeded
# spawn the target cannot produce yet.
name: chat-subagents-panel-empty
tier: nightly
feature: chat
user_story: >-
  As a user, I want a panel that lists the background agent runs a session has
  spawned, so that I can follow delegated work -- and see plainly when there is
  none.
docs_url: docs/system-specs/modules/subagent.md
summary: Open the Subagents view with Ctrl+G in a seeded session and read its empty state
preconditions:
  seed: rich
  members: [nova-sky]
  start_url: /chat
steps:
  - You are on the chat page. In the left sidebar click the pinned session "Welcome to KiroCrew" so a conversation is open.
  - Click once on an empty part of the conversation area so the page (not the message box) has focus, then press Ctrl+G.
  - A side panel opens to the right of the conversation on a tab named "Subagents". Read it.
expectations:
  - A side panel is open beside the conversation and its "Subagents" tab is the active one.
  - The panel body reads "No subagents running" and lists no runs.
  - The conversation transcript is still visible to the left of the panel and has not been covered by it.
max_steps: 10
max_seconds: 300
